<div id="favorites" class="favorites">
  <h2>Choose your <i>favorite</i> coffee</h2>
  <div *ngFor="let product of favorites; index as i">
    <h3>{{ product.name }}</h3>
    <p>{{ product.description }}</p>
    <strong>Цена: ${{ product.price }}</strong>
    <span *ngIf="product.discountPrice"
      >Скидка: ${{ product.discountPrice }}</span
    >
  </div>
</div>
